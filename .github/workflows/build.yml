name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          echo "STEAM_API_KEY=${STEAM_API_KEY}" > local.properties
          # gradle-wrapper.jar is binary and not committed; regenerate it here
          [ -f gradle/wrapper/gradle-wrapper.jar ] || gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :launcher:testDebugUnitTest :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk quest-standalone-steam.apk
      - uses: actions/upload-artifact@v4
        with: { name: quest-standalone-steam-apk, path: quest-standalone-steam.apk }
      - name: Publish release v0.2.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: "v0.2.1 (fix runtime install)"
          prerelease: true
          files: quest-standalone-steam.apk
          body: "Fixes Install runtime failing with ZipException invalid LOC header: verified download (size + SHA-256 of Winlator v11.2.0 APK, correct 200/206 resume handling, auto re-download, single install at a time), exec bit fix for box64, clearer logs. Extraction verified on desktop JVM against the real APK; still untested on Quest/phone hardware."
