name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          echo "STEAM_API_KEY=${STEAM_API_KEY}" > local.properties
          # gradle-wrapper.jar is binary and not committed; regenerate it here
          [ -f gradle/wrapper/gradle-wrapper.jar ] || gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :launcher:testDebugUnitTest :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk quest-standalone-steam.apk
      - uses: actions/upload-artifact@v4
        with: { name: quest-standalone-steam-apk, path: quest-standalone-steam.apk }
      - name: Publish release v0.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: "v0.3.0 (new launcher UI)"
          prerelease: true
          files: quest-standalone-steam.apk
          body: "New Compose launcher UI: Home/Games tabs, Steam avatar + sign out, synced library as flip cards (Download / Import from folder, progress + ETA, Play Game, Uninstall), category slider (All, VR, Installed, genres) and Browse popup (search, All games, A-Z jump). Direct Steam downloads not implemented yet (honest error); folder import works. Runtime/smoke test under Settings. Untested on hardware."
