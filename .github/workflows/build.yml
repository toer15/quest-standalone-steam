name: Build APKs
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/qss, key: winlator-11.2.0 }
      - name: Fetch Winlator runtime (cached) for the real runtime smoke test
        run: |
          mkdir -p ~/.cache/qss
          [ -f ~/.cache/qss/Winlator_11.2.apk ] || curl -sSfL -o ~/.cache/qss/Winlator_11.2.apk https://github.com/brunodev85/winlator/releases/download/v11.2.0/Winlator_11.2.apk
          # The runtime is installed at the app's real path, like on the device.
          sudo mkdir -p /data/data/com.qssteam/files && sudo chown -R "$USER" /data
      - name: Bundle the Vortek GPU driver + DXVK (Winlator 11.2, LGPL-2.1)
        run: |
          python3 tools/vortek/bundle_vortek.py ~/.cache/qss/Winlator_11.2.apk app/src/quest/jniLibs/arm64-v8a app/src/quest/assets/graphics
          readelf -d app/src/quest/jniLibs/arm64-v8a/libvortekrenderer.so | grep -q "NEEDED.*libwlvortek.so"
          readelf -d app/src/quest/jniLibs/arm64-v8a/libwlvortek.so | grep -q "SONAME.*libwlvortek.so"
          ! grep -q Java_com_winlator app/src/quest/jniLibs/arm64-v8a/libwlvortek.so
      - name: Build the SteamVR + controller bridge DLLs (mingw) and test them under Wine
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends mingw-w64 wine64 xvfb libgl1-mesa-dri
          openvr-bridge/win/build.sh app/src/quest/assets/vrbridge/openvr_api.dll
          openvr-bridge/test/run_wine_test.sh app/src/quest/assets/vrbridge/openvr_api.dll
          # Controller bridge: XInput DLLs (64 + 32-bit), tested with a fake controller under Wine.
          openvr-bridge/win/build_xinput.sh app/src/quest/assets/gamepad
          openvr-bridge/test/run_pad_test.sh app/src/quest/assets/gamepad/xinput64.dll
      - name: Bundle the game display app (Termux:X11, GPL-3.0, github.com/termux/termux-x11)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/quest/assets/display
          rel=$(gh api repos/termux/termux-x11/releases/tags/nightly)
          url=$(echo "$rel" | jq -r '.assets[] | select(.name | test("arm64-v8a.*\\.apk$")) | .browser_download_url' | head -1)
          [ -n "$url" ] || url=$(echo "$rel" | jq -r '.assets[] | select(.name | test("universal.*\\.apk$")) | .browser_download_url' | head -1)
          echo "Termux:X11: $url"
          curl -sSfL -o app/src/quest/assets/display/termux-x11.apk "$url"
          ls -l app/src/quest/assets/display/termux-x11.apk
          # Keyboard layouts for its X server (XKB_CONFIG_ROOT); without them it quits at start.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xkb-data zip
          (cd /usr/share/X11 && zip -qr "$GITHUB_WORKSPACE/app/src/quest/assets/display/xkb.zip" xkb)
          unzip -l app/src/quest/assets/display/xkb.zip | grep -E "xkb/rules/evdev$|xkb/symbols/us$|xkb/keycodes/evdev$" | tee /dev/stderr | wc -l | grep -qx 3
          ls -l app/src/quest/assets/display/xkb.zip
      - name: Build the Quest 3 APK
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          echo "STEAM_API_KEY=${STEAM_API_KEY}" > local.properties
          # gradle-wrapper.jar is binary and not committed; regenerate it here
          [ -f gradle/wrapper/gradle-wrapper.jar ] || gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :steamclient:test :launcher:testDebugUnitTest :app:testQuestDebugUnitTest \
            -Dwinlator.apk=$HOME/.cache/qss/Winlator_11.2.apk -Dwinlator.smoke=1 -Dsteam.live=1 \
            :app:assembleQuestRelease --no-daemon 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          # Short summary of compiler errors / failed tests at the end of the log.
          grep -E "^e: |FAILED|Test.*>|OutOfMemory|Gradle .* disappeared|exit value" build.log | sort -u | head -60 || true
          grep -A15 "What went wrong" build.log | grep -vE "^\s+at " | head -60 || true
          [ "$status" -eq 0 ] || exit "$status"
          apk=app/build/outputs/apk/quest/release/app-quest-release.apk
          [ -f "$apk" ] || { echo "Signed release APK missing (unsigned build?):"; find app/build/outputs/apk -name "*.apk"; exit 1; }
          cp "$apk" quest-steam-quest3.apk
          # Never publish an APK Android would refuse: check the signature and that the package parses.
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs quest-steam-quest3.apk | grep -E "Verified using|Signer #1 certificate SHA-256"
          want=$(keytool -list -v -keystore app/sideload.jks -storepass queststeam -alias qss | sed -n 's/.*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f')
          "$bt/apksigner" verify --print-certs quest-steam-quest3.apk | grep -qi "SHA-256 digest: $want" \
            || { echo "APK is not signed with the sideload key ($want)"; exit 1; }
          "$bt/aapt2" dump badging quest-steam-quest3.apk | head -3
          # The game's GPU path: our X server (libwinlator) + Vortek (renderer, helpers, guest driver, DXVK).
          for f in lib/arm64-v8a/libwinlator.so lib/arm64-v8a/libvortekrenderer.so lib/arm64-v8a/libwlvortek.so lib/arm64-v8a/libmain_hook.so lib/arm64-v8a/libhook_impl.so \
                   assets/graphics/vortek-2.1.tzst assets/graphics/default.box64rc assets/graphics/dxvk-1.10.3.tzst assets/graphics/dxvk-2.4.1.tzst; do
            unzip -l quest-steam-quest3.apk "$f" | grep -q "$f" || { echo "missing in APK: $f"; exit 1; }
          done
          "$bt/aapt2" dump badging app/src/quest/assets/display/termux-x11.apk | head -1 | tee /dev/stderr | grep -q "name='com.termux.x11'"
      - uses: actions/upload-artifact@v4
        with:
          name: quest-steam-apks
          path: |
            quest-steam-quest3.apk
      - name: Publish release v0.14.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.1
          target_commitish: ${{ github.sha }}
          name: "v0.14.1: lighter Steam, the log survives the app closing"
          prerelease: true
          files: |
            quest-steam-quest3.apk
          body: |
            **Meta Quest 3 app:** `quest-steam-quest3.apk`

            **v0.14.1:**
            - **The log survives the app being closed.** When Android closes the app while a game starts (for example because the headset ran out of memory), the next start shows that run's log again, starting with Android's own reason ("ran out of memory", "crashed in native code"…), the app's memory use at that moment, and errors the app caught in the background. Copy it or share it as usual.
            - **Light Steam (on by default):** Steam's built-in browser runs as one process instead of five or six. Under the Windows translation each of those processes costs hundreds of MB, and next to a game that likely ran the headset out of memory (the headset stuttering, then the app closing). If Steam's window misbehaves, switch to **Full Steam** in Runtime settings → Steam for Windows.
            - **Steam gets the lowest CPU priority while a game starts or runs** (and the small CPU cores), so the game gets the rest. In v0.14.0 Steam ran at full speed next to the game.
            - Steam's browser is no longer restarted as "not responding" when it answers slowly.
            - While a game loads, the log shows free memory and how much Steam and the game use, every 15 seconds.

            **v0.14.0:**
            - **Games start next to a running Steam again.** In v0.13.9, R.E.P.O. stayed on loading: the log showed "no driver could be loaded / The explorer process failed to start", meaning the game couldn't open its window. Games now get their own game screen (a Wine desktop) next to Steam's, exactly as when no Steam runs.
            - **Fixed the game display running out of room for programs:** Winlator's display allowed 128 connections, and Steam uses many (every Wine program and its window threads). When it ran full, every later program got a broken connection and couldn't open a window. Now 1024, a full display refuses cleanly, and a broken slot is never handed out again. The display's three servers also no longer share one event buffer.
            - The app no longer took a game that was still starting for one that had closed ("R.E.P.O. closed while starting" while it was loading).
            - **New FRIENDS tab, fast like the Store:** your Steam friends with who's online and what they play, and chat with them. It uses the app's own Steam connection, not Steam for Windows' slow window. The card on top says whether Steam for online games is running, with **Show its window** and **Close it**.
            - **The app stays fast while Steam runs in the background:** Steam's programs get the lowest CPU priority while you're in the app, and normal priority again when a game or Steam is on screen.
            - **Steam starts faster:** its own programs no longer load DXVK and its GPU probes no longer start Vulkan. Each did a full GPU-driver handshake (your log had many), and one Steam process crashed doing it.
            - **Close Steam lets Steam close itself**, so it saves its sign-in and settings, instead of ending it at once.
            - While a game loads, the log shows the last lines the game wrote (Unity's Player.log) and how many programs are connected to the display, so a game stuck on loading shows where.

            **v0.13.9:**
            - **Steam stays running, like on a PC.** Leaving Steam's screen (✕ Leave) keeps Steam running in the background: **Show Steam** brings it back at once, and **Close Steam** (Runtime settings) ends it.
            - **Games start inside the running Steam:** pressing Play while Steam runs starts the game right away, with no Steam restart and no sign-in wait. When the game closes you're back in the app and Steam is still signed in. If Steam isn't running, Play starts it first (signed in), then the game, and Steam stays for the next game.
            - **Your downloaded games show up in Steam's own library as installed**, so Play in Steam starts them too (Steam may first check for an update).
            - **Faster Wine:** Wine's fast synchronization (esync) is on, as in Winlator. Waits and locks no longer go through the Wine server each time, which helps Steam's browser and modern games most.
            - Steam's heavy visual extras are off (smooth scrolling, and GPU and video acceleration in its windows, which have no GPU here).
            - Games started by Steam get the same graphics (DXVK) and controller DLLs as games started by the app.

            **v0.13.8:**
            - **Steam's sign-in window now opens on screen.** Steam was running and showing "Sign in to Steam", but the app kept the loading screen up because it waited for a GPU frame, and Steam's window is drawn without the GPU. The app now switches as soon as Steam's sign-in window appears.
            - **⌨ Keyboard** button on the game screen (top right): select a field in Steam or a game, type with the Quest's keyboard and the letters go straight into it (Tab, Enter and ⌫ buttons too). The box hides what you type, for passwords. You can also sign in with the QR code in the Steam phone app.
            - The log shows Steam's connection attempts (connects, drops, sign-in results), to find out why a sign-in fails.

            **v0.13.7:**
            - **Fixes Steam never opening** (Steam.exe stuck at 0 seconds of processor time, no window, no Steam logs). The Winlator settings file the app uses tells Wine to run a helper before steam.exe; that helper waits for an answer from the Winlator app itself, which isn't there, so Steam waited forever. The app now removes that hook (the log says "Runtime fix: removed WINPREEXEC…" once).
            - Steam's files are unpacked without leaving two copies of steam.exe (Steam.exe from the installer and steam.exe from Valve's package); an existing duplicate is cleaned up.
            - An interrupted Steam download/unpack is finished on the next start instead of being taken as done.
            - The running-programs list names helper processes (e.g. "Steam.exe(loading)"), and more of Steam's startup messages go to the log.

            **v0.13.6:**
            - While Steam starts, the loading screen lists the Windows programs that are running and how much processor time each has used (e.g. "Steam.exe 40s, steamwebhelper.exe ×3 25s"), so you can see it's working.
            - The log adds the same list every 15 seconds, and when you stop, the last lines of Steam's own log files (why Steam didn't open its window).

            **v0.13.5:**
            - Steam starts faster after its first start: Box64 now keeps the code it translated for Steam on storage (its translation cache), so Steam doesn't have to be translated from scratch every time. Games keep Winlator's setting.

            **v0.13.4:**
            - **Steam for Windows downloads much faster:** the app now downloads Steam's files itself (4 at a time, from Valve's update server) and unpacks them, with a progress bar ("Downloading Steam… 120 of 380 MB"), instead of Steam's own updater doing it slowly under the Windows translation. Then Steam opens for sign-in.
            - Works for Install Steam for Windows, Open Steam, and Play when Steam still needs signing in.

            **v0.13.3:**
            - **Steam's sign-in opens inside the app**, on the same screen as games (✕ Leave game brings you back). Pressing **Play** on a game before you've signed in to Steam opens Steam's sign-in first; the log says "✓ Signed in to Steam" when you're done, then press Play again.
            - Steam's first start shows what it's doing: **Downloading Steam… 45%** with a progress bar, then **Unpacking / Installing Steam**, then Steam's window opens by itself. The lines under it are Steam's own messages.
            - While Steam starts, the loading screen has no **Show game window** button any more (it only showed a black screen while Steam was still downloading); Steam's window opens by itself when it's ready.
            - For games the button appears after 60 seconds instead of 20, as a fallback for a game that seems stuck.

            **v0.13.2:**
            - **Open Steam** shows what Steam is doing on its first start (it downloads and installs the real Steam, a few hundred MB, before any window appears): the loading screen shows Steam's own update log and a timer, and waits up to 40 minutes instead of 5.

            **v0.13.1:**
            - Fixes "Steam install failed: the installer ended (code 0) without steam.exe": Steam was installed, but Valve names it Steam.exe and the check looked for steam.exe (Android's storage is case-sensitive). Press **Install Steam for Windows** again; it finishes right away and **Open Steam and sign in** appears.

            **v0.13.0:**
            - **Steam for Windows** (Runtime settings → Steam for Windows): online games like R.E.P.O. need the Steam client running, as on a PC ("Steamworks failed to initialize … Could not determine Steam client install directory"). **Install Steam for Windows** downloads Valve's official installer and installs Steam inside the runtime; **Open Steam and sign in** shows Steam in the game screen (the first start updates Steam, which takes several minutes; then sign in once, e.g. with the QR code in the Steam phone app).
            - When you press Play, the app starts Steam in the background first, waits until it is signed in ("Starting Steam… 40s"), then starts the game. Steam's overlay is off (too heavy). Can be turned off: "Don't start with games".
            - Wine now sees the headset's network (like Winlator does): fixes "getaddrinfo Failed to resolve your host name" and lets Steam and online games connect.
            - The loading screen waits for the game's own window (not Steam's or Wine's).

            **v0.12.9:**
            - **Select the log text yourself:** hold on the log (Runtime screen, or the "didn't start" screen), drag to choose, then Copy or Select all.
            - **Copy part 1/2/3…** buttons under a long log: each part fits in one message; paste them one after another.
            - Copy log / Share log: the summary covers only the last game start and includes the GPU driver's frame lines, a list of the windows on the game screen (shown or hidden, drawn by the GPU or not) and the last lines of the game's own log.

            **v0.12.8:**
            - Games start on Winlator's game desktop ("nogui": no taskbar or start menu), like Winlator does, instead of Wine's desktop with a shell.
            - **Clicks and the pointer reach the game:** hiding Wine's desktop also blocked input to every window inside it, including the game.
            - The loading screen switches to the game when the game presents its first frame through the GPU driver (Vulkan/DirectX games draw into a window Wine makes inside the game's window, so the old signal could miss them).
            - The log says which window the GPU driver draws into and how many frames have been shown ("Vortek: 120 frames shown"), so a black screen can be told apart from a game that isn't drawing yet.

            **v0.12.7:**
            - **Fixes R.E.P.O. (and other Unity games) crashing right after the graphics started.** The crash was in Windows' audio system (mmdevapi → ucrtbase): Wine had no sound server to talk to and handed the game a broken audio device.
            - **Game sound:** the app now runs Winlator's sound server (Wine's ALSA output → Android audio), so games play sound through the headset.
            - Runtime settings → Game display → **Game sound** On/Off. Off gives games no audio device (for a game that has trouble with sound).

            **v0.12.6:**
            - **Copy log / Share log start with "== Why it stopped =="**: the crash (in which DLL), the game's own errors and DXVK's errors come first, so they survive when a messaging app cuts a long text. DXVK's long info lists (memory types, extensions) are left out of the copied text; the shared .txt file still has the complete log.

            **v0.12.5:**
            - **Share log**'s message text now always includes the crash details ([crash], [crash stack], Unity's graphics/GPU lines from Player.log, DXVK's log), not only the attached file.
            - Unity's Player.log section also lists where UnityPlayer.dll / Mono / the game were loaded, so a crash address can be matched to a DLL.

            **v0.12.4:**
            - Direct3D 11 now starts on the Quest: DXVK 2.4.1 on Vortek (Adreno 740, Vulkan 1.3) creates a feature level 11_1 device.
            - DXVK gets Winlator's settings file (dxvk.conf: constant buffer range checks).
            - When a game crashes, the log now says in which DLL ("[crash] read of 0x… in UnityPlayer.dll+0x…") and lists the crash's call stack by DLL, from Unity's own module list.

            **v0.12.3:**
            - **Share log** button (Runtime screen → Log, and on the "game didn't start" screen): opens Android's share menu so the log can go straight to Messenger, Discord, email, Drive… The whole log is attached as a .txt file, with the important lines as the message text.
            - **Copy log** button next to it: copies the whole log so it can be pasted into a message.
            - Games run with Winlator's own Box64 and Wine settings: its per-game fixes file, the safer "Intermediate" Box64 preset (helps games that crash on start, like Unity games), and Winlator's Wine settings (no DXGI device manager).
            - Crash info that means something: Unity's crash stack noise ("SymGetModuleInfo64 … DLL initialization failed") is filtered out of the game log, the Vulkan loader's chatter is gone, and DXVK's own log files (which GPU it found, why D3D11 failed) are added.

            **v0.12.2:**
            - **"Failed to initialize player / Failed to initialize graphics" (Unity, DirectX 11):** the app asked Android for the Quest's Vulkan version, which says 1.1, so it installed the old DXVK 1.10.3. It now asks the GPU driver itself (like Winlator) and uses DXVK 2.4.1 when the driver supports Vulkan 1.3.
            - **Fixes the app closing with "OutOfMemoryError":** the game's screen buffers count against the app's memory, so the app now asks Android for the large memory limit (like Winlator).
            - The loading screen no longer says "Opening game now" just because Wine's desktop appeared; it waits for the game's own window.
            - Better error info: the error screen shows Wine/DXVK errors instead of the GPU driver's info dump, DXVK says which GPU it found and why it fails, and Unity games' own Player.log errors are added to the log.

            **v0.12.1:**
            - **Fixes the next game failing after a stopped one** ("X Error … BadWindow … X_CreateWindow"): stopping a game left Wine's background processes running, and the next game used their old windows. Now every Wine process from the last game is closed before a game starts and when it stops.
            - Vortek: its cache files now go to this app's own folder (they pointed at Winlator's), and it gets the helper libraries Winlator ships with it.
            - The log shows what the GPU driver does ("Vortek: the game's Vulkan connected", "Vulkan device ready", or why it failed) plus the app's own Android log lines about the GPU, so the next screenshot shows exactly where it stops.

            **v0.12.0:**
            - **Fixes games stopping with "BO init VK_ERROR_OUT_OF_DEVICE_MEMORY" / "Failed to create D3D11 device".** The Quest doesn't let the Turnip GPU driver use the GPU. Games now draw through **Vortek** (Winlator 11's default): the game's Vulkan calls run on the Quest's own GPU driver inside this app, and the picture goes straight into the game screen in the app's window.
            - DXVK is matched to the headset: DXVK 2.4.1 on Vulkan 1.3, else DXVK 1.10.3 (installed automatically).
            - Runtime settings → Game display → **GPU driver**: Vortek (recommended) or Turnip.
            - The log shows the GPU path: "GPU: Vortek", the headset's Vulkan version and the DXVK version.

            **v0.11.0:**
            - **Games play inside the app's own window.** Press Play → the loading screen → the same window turns into the game. No second app, no separate window, nothing to install. When you leave the game (**✕ Leave game** or Back → **Leave game**), or the game closes, you're back in the app.
            - The game display is now built into the app (Winlator's X server, made for the same Windows runtime and GPU driver), which is faster than going through the Termux:X11 app.
            - In the game: point and pull the trigger to click, thumbstick/mouse wheel to scroll, two fingers for right click; Bluetooth controllers go straight to the game.

            **v0.10.4:**
            - The game window (Termux:X11) now opens and connects to the display **before** the game starts (it showed only its "X" logo, i.e. it never connected), then the loading screen comes back in front.
            - The game window is landscape, 1280x720 stretched to fill it, without the extra-keys bar.
            - The loading screen shows the game's and the display's latest output (not just "waiting"), and the log says how many windows the game has made, so the next photo shows exactly where it stops.

            **v0.10.3:**
            - **Clear log** button on the Runtime screen's Log.
            - **Cancel** on the loading screen (or Close on an error, Stop game, or the game ending) now goes straight back to the library you came from instead of the Runtime settings screen.

            **v0.10.2:**
            - The loading screen no longer waits forever: after at most 90 seconds it opens the game's window anyway, and from 20 seconds a **Show game window** button lets you look at the game while it's still starting.
            - The loading screen shows the game's latest output lines, and the log says every 15 seconds what it's waiting for, so a stuck start can be diagnosed from a photo.

            **v0.10.1:** fixes the game display stopping at once with "$XKB_CONFIG_ROOT is not set" (display server exited with code 1), so games never got a window. The keyboard layout data it needs is now included and set up automatically.

            **v0.10.0:**
            - **Play a game flat:** Play → choose **Play flat** → a loading screen with the game's picture shows what's happening ("Starting the game display…", "Loading R.E.P.O.… 12s"), then **Opening game now…**, then the game opens in its window. While playing: **Back to game** / **Stop game**. If a game fails to start, the screen says why and shows the log.
            - **VR view is no longer just blue:** it shows the app itself in front of you — library, downloads, Store, and VR games start right there. Point with a Touch controller, pull the trigger to tap, thumbstick to scroll, click the thumbstick to bring the panel in front of you. **🥽 VR** in the top bar opens it; **Exit VR** closes it.
            - **Old files are deleted after every update:** the first start of a new version removes old update downloads, caches, logs and temp files from older versions. Your games, sign-in and settings stay.

            **v0.9.3:**
            - **Games get their window without Termux.** The game display app (Termux:X11) now comes with Quest Steam: Runtime screen or the Play popup → **Install game display app** (one tap). Quest Steam starts the display by itself before every game, so "nodrv_CreateWindow … The graphics driver is missing" (game closing right after start) is fixed.
            - If you press Play without it, a popup offers the install and then **Play**.

            **v0.9.2:** Store tab fix: browsing and searching now list every Steam game page after page (Steam's search answers with a different format than expected).

            **v0.9.1:**
            - **The app opens again by itself after an in-app update** (or shows "Quest Steam updated · tap to open" if the headset doesn't allow that).
            - **Controller on game cards:** A on a card turns it around and selects **Download** / **Play Game** / **Cancel**; D-pad reaches **Uninstall** and **Import from folder**; B turns the card back.
            - **"Display over other apps"** switches to **✓ Already allowed** by itself as soon as you allow it.

            **v0.9.0:**
            - **Downloads no longer stop half-way.** They keep running when the app's panel is closed (a download notification shows progress), reconnect and resume by themselves if the connection drops or Steam stops sending data, and an unfinished download continues after the app or headset restarts.
            - **Downloaded games stay installed** until you turn the card around and tap **Uninstall**.
            - **Game sizes on every card** (from Steam), and while downloading a **blue bar sliding over grey** with "37% of 4.5 GB · 3m left".
            - **Grey game pictures fixed**: newer games' pictures are loaded from Steam's new image address, with more fallbacks.
            - **Store tab** between Home and Games: search bar at the top, top sellers, new & trending, specials, VR, free and all games on Steam, with prices. **Buy** opens Steam's own checkout in the app; when you come back, the game is in your library with Download.

            **v0.8.0:**
            - **Bluetooth controllers in games:** pair an Xbox, PlayStation (DualSense / DualShock), Switch Pro or 8BitDo controller with the Quest and Windows games see it as an Xbox (XInput) controller, with rumble. Works in flat games and in VR games.
            - **The app shows your controller:** the top bar shows the exact model (for example "DualSense Wireless Controller (PS5)") when it's connected, or "No controller".
            - **Play popup like Steam:** before a game starts, choose **Play in VR** (in the headset) or **Play flat** (on a big screen with your controller), and see the controller status.
            - **Use the app like a console:** D-pad or left stick moves between cards and buttons, A selects, B goes back, LB/RB switch tabs, Y opens Filters, X syncs, Start checks for updates.
            - **Update popup** also checks again whenever you come back to the app, not just when it starts.
            - Flat games: allow "Display over other apps" (Play popup → Allow) so the controller keeps working while the game window is in front.

            **v0.7.0:**
            - **Download no longer closes the app.** An error while downloading now stops that download and shows the reason on the card, with **Retry download**. If the app ever does close unexpectedly, the next start shows the crash report with a **Copy** button.
            - The download system is now tested for real on every build: CI signs in to Steam (anonymously) and downloads an actual Steam app from Steam's CDN with the same code the app uses.
            - **Play** starts the game the way Steam does, using Steam's launch option (the right .exe and its arguments) instead of guessing the biggest .exe.
            - **Home → Filters** (top right) opens a side panel with check boxes: VR games only, installed only, not installed only, played games only, genres, and sort order.

            **v0.6.2:** fixes "Install failed … pm install exited with code 1": v0.6.1 was published unsigned by mistake. This build is signed again (and CI now refuses to publish an unsigned APK).

            **v0.6.1:**
            - **"wine: could not load kernel32.dll" (exit code 53) fixed for every install:** before each launch the app now checks the Wine prefix and repairs it automatically, so a runtime downloaded by an older version works without reinstalling.
            - **New Runtime screen:** ✕ close button; the Windows runtime card shows **(Downloaded)** and the button becomes **Delete this runtime download** (your games are kept and come back if you download it again). If it's not downloaded: **Download runtime**.
            - The phone version is gone; this is the Quest 3 app.

            **v0.6.0:** in-app updates (Update now with progress and time left; Home → Check for updates).
            **v0.5.x:** faster app (release builds), SteamVR bridge into the headset, Turnip GPU driver + DXVK.
            Untested on hardware; feedback welcome.
      - name: Check Steam endpoints the app uses (informational)
        continue-on-error: true
        run: |
          set -x
          # Steam for Windows client manifests (the app downloads these packages itself).
          curl -sS -m 30 "https://client-update.steamstatic.com/steam_client_win64" | head -40
          curl -sS -m 30 "https://client-update.steamstatic.com/steam_client_win32" | head -25
          curl -sS -o /dev/null -w "new header %{http_code}\n" "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3241660/header.jpg"
          curl -sS -o /dev/null -w "old header %{http_code}\n" "https://cdn.cloudflare.steamstatic.com/steam/apps/3241660/header.jpg"
